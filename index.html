<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전북대학교 경상대학 시설예약 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <header class="bg-red-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="font-bold text-lg cursor-pointer" onclick="location.reload()">전북대 경상대학 시설예약</h1>
            <div class="space-x-2">
                <button id="nav-my-reservations" class="text-sm bg-red-800 hover:bg-red-700 px-3 py-1.5 rounded-lg transition">내 예약 확인</button>
                <button id="nav-admin" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition">관리자</button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6 flex-1 w-full" id="main-container"></main>

    <!-- 관리자 로그인 화면 -->
    <div id="admin-login-container" class="hidden max-w-3xl mx-auto px-4 py-12 w-full">
        <div class="bg-white p-6 rounded-2xl shadow-sm border max-w-md mx-auto">
            <h3 class="text-lg font-bold text-slate-800 mb-4">관리자 로그인</h3>
            <input type="password" id="admin-password" placeholder="비밀번호를 입력하세요" class="w-full px-4 py-2 border rounded-xl mb-3 focus:outline-none focus:ring-2 focus:ring-red-900">
            <button id="admin-login-btn" class="w-full bg-red-900 text-white py-2 rounded-xl font-bold hover:bg-red-800 transition">로그인</button>
            <p id="admin-login-error" class="hidden text-red-500 text-sm mt-2 text-center">비밀번호가 틀렸습니다.</p>
        </div>
    </div>

    <!-- 관리자 대시보드 화면 -->
    <div id="admin-dashboard-container" class="hidden max-w-3xl mx-auto px-4 py-6 w-full">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-slate-800">관리자 대시보드 (전체 예약 내역)</h2>
            <button id="admin-logout-btn" class="text-sm bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded-lg transition">로그아웃</button>
        </div>
        <div id="admin-reservations-content"></div>
    </div>

    <footer class="bg-slate-200 text-slate-500 text-center py-4 text-xs">
        &copy; 2026 전북대학교 경상대학 학생회. All rights reserved.
    </footer>
    <script type="module" src="app.js"></script>
</body>
</html>
